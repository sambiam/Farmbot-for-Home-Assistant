execute_sequence:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: farmbot
    sequence_id:
      required: true
      example: 123
      selector:
        number:
          min: 1
          mode: box
move_to:
  # At least one of x, y or z must be supplied.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: farmbot
    x:
      selector:
        number:
          mode: box
          step: any
    y:
      selector:
        number:
          mode: box
          step: any
    z:
      selector:
        number:
          mode: box
          step: any
    speed:
      selector:
        number:
          min: 1
          max: 100
          mode: slider

list_vision_bots:
  fields: {}

get_vision_inventory:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: farmbot
    image_lookback_hours:
      example: 72
      selector:
        number:
          min: 0
          max: 336
          mode: box
    include_all_curves:
      selector:
        boolean:

get_vision_image:
  # Returns a base64 JPEG plus scaling metadata (source/oriented/output
  # dimensions, resize_scale_x/y), sha256 of the RETURNED JPEG, optional
  # source_sha256, and processed_calibration. The image is fitted inside the
  # max_width x max_height box (aspect ratio preserved, never upscaled).
  # Common analysis boxes: 640x480, 960x720, 1280x960.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: farmbot
    image_id:
      required: true
      example: 12345
      selector:
        number:
          min: 1
          mode: box
    max_width:
      example: 960
      selector:
        number:
          min: 32
          max: 4096
          mode: box
    max_height:
      example: 720
      selector:
        number:
          min: 32
          max: 4096
          mode: box

